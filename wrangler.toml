name = "developer-dashboard"
main = "server/worker.ts"
compatibility_date = "2026-11-01"
keep_vars = true
workers_dev = false
preview_urls = false
routes = [{ pattern = "dashboard.evanwindproof.top", custom_domain = true }]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[[durable_objects.bindings]]
name = "PUBLIC_REPOSITORY_CACHE"
class_name = "PublicRepositoryCache"

[[migrations]]
tag = "public-repository-cache-v1"
new_sqlite_classes = ["PublicRepositoryCache"]

[[d1_databases]]
binding = "DB"
database_name = "evan-developer-dashboard-prod"
database_id = "0e6ddcb9-9340-4613-8773-6331ba97844b"
migrations_dir = "migrations"

[vars]
APP_BASE_URL = "https://dashboard.evanwindproof.top"
