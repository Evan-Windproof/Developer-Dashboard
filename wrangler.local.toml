name = "evan-developer-dashboard"
main = "server/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[[durable_objects.bindings]]
name = "PUBLIC_REPOSITORY_CACHE"
class_name = "PublicRepositoryCache"

[[migrations]]
tag = "public-repository-cache-v1"
new_sqlite_classes = ["PublicRepositoryCache"]

[[d1_databases]]
binding = "DB"
database_name = "evan-developer-dashboard"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
